services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: roadbook
      POSTGRES_PASSWORD: password
      POSTGRES_DB: roadbook
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roadbook"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: roadbook-api:local
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://roadbook:password@postgres:5432/roadbook
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
